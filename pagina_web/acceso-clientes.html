<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK'S - Acceso Clientes</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mensajes.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="img/logo_marks.png" alt="MARK'S Logo" class="logo-img">
        </div>
        <nav>
            <ul class="nav-buttons">
                <li><a href="index.html" class="nav-btn">Inicio</a></li>
                <li><a href="acceso-clientes.html" class="nav-btn active">Clientes</a></li>
            </ul>
        </nav>
    </header>

    <section class="main-section hero-layout">
        <div class="hero-left-content">
            <div class="content-box">
                <h1>TU CUENTA MARK'S</h1>
                <p>Consulta tus puntos, tus compras y cuánto has ahorrado comprando sin filas con MARK'S.</p>
            </div>

            <div class="center-showcase-row">
                <div class="mockup-container">
                    <img src="img/imagen_inicio.png" alt="MARK'S Mockup" class="mockup-img">
                </div>
                <div class="action-side-container">
                    <a href="supermercados.html" class="btn-verde">Descarga la APP</a>
                </div>
            </div>
        </div>
        
        <div class="visual-card" id="login">
            <div class="login-container">
                <h2>Acceso Clientes</h2>
                <!--
                    El JavaScript (js/login.js) envía este formulario a la API. No cambiar los id.
                    data-roles:       roles que pueden entrar por aquí
                    data-destino:     página que se abre al entrar
                    data-mensaje-rol: mensaje si la cuenta es de otro tipo
                -->
                <form id="form-login" class="login-form" novalidate
                      data-roles="CLIENTE"
                      data-destino="mi-cuenta.html"
                      data-mensaje-rol="Esta cuenta es del personal de MARK'S. Entra por el Acceso Admin en Inicio.">
                    <div class="input-group">
                        <label for="email">Correo</label>
                        <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" autocomplete="username" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
                    </div>
                    <div class="form-actions">
                        <a href="restablecer.html" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                    </div>
                    <p id="login-mensaje" class="mensaje" role="alert" hidden></p>
                    <button type="submit" id="btn-ingresar" class="btn-login">Ingresar</button>
                </form>
                <div class="login-footer">
                    <p>¿No tienes cuenta? <a href="registro.html">Crea tu cuenta aquí</a></p>
                </div>
            </div>
        </div>
    </section>

    <script src="js/api.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
