<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>MARK'S - Restablecer Contraseña</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="img/logo_marks.png" alt="MARK'S Logo" class="logo-img">
        </div>
        <nav>
            <ul class="nav-buttons">
                <li><a href="index.html" class="nav-btn">Inicio</a></li>
            </ul>
        </nav>
    </header>

    <section class="main-section" style="max-width: 500px; padding: 45px 40px; text-align: center;">
        
        <div style="font-size: 50px; margin-bottom: 10px;">🔒</div>
        
        <span style="background-color: #e2fbe0; color: #2e7d32; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 12px;">Validación de Seguridad</span>
        
        <h1 style="font-size: 28px; color: #2b581b; margin-top: 0; margin-bottom: 12px;">Crea tu Nueva Contraseña</h1>

        </p>

        <form onsubmit="alert('¡Contraseña actualizada con éxito! Ya puedes iniciar sesión.'); window.location.href='index.html'; return false;" class="login-form" style="text-align: left;">

                <input type="password" placeholder="••••••••" required>
            </div>
            
            <div style="margin-top: 25px;">
                <button type="submit" class="btn-login" style="width: 100%;">
                    Actualizar Contraseña
                </button>
            </div>
        </form>

    </section>

</body>
