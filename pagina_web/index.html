<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK'S - Acceso Administrativo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <img src="img/logo_marks.png" alt="MARK'S Logo" class="logo-img">
        </div>
        <nav>
            <ul class="nav-buttons">
                <li><a href="index.html" class="nav-btn active">Inicio</a></li>
            </ul>
        </nav>
    </header>

    <section class="main-section hero-layout">
        <div class="hero-left-content">
            <div class="content-box">
                <h1>PORTAL DE ADMINISTRACIÓN Y SUPERVISIÓN</h1>
                <p>Gestiona el inventario, monitorea alertas de caducidad y analiza las ventas de tu supermercado en tiempo real con MARK'S.</p>
            </div>

            <div class="center-showcase-row">
                <div class="mockup-container">
                    <img src="img/imagen_inicio.png" alt="MARK'S Mockup" class="mockup-img">
                </div>
                <div class="action-side-container">
                    <a href="supermercados.html" class="btn-verde">Descarga la APP</a>
                </div>
            </div>
        </div>
        
        <div class="visual-card" id="login">
            <div class="login-container">
                <h2>Acceso Admin</h2>
                <form action="dashboard.html" method="GET" class="login-form">
                    <div class="input-group">
                        <label for="email">Correo / Usuario</label>
                        <input type="email" id="email" name="email" placeholder="admin@supermercado.com" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    <div class="form-actions">
                        <a href="restablecer.html" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                    </div>
                    <button type="submit" class="btn-login">Ingresar</button>
                </form>
                <div class="login-footer">
                    <p>¿Eres un nuevo comercio? <a href="supermercados.html">Registrate aquí</a></p>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
